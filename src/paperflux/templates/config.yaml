# Which LLM backend to use: "openai", "anthropic", or "hermes".
provider: "openai"

openai:
  api_key: "ENV:PAPERFLUX_OPENAI_API_KEY"
  model: "gpt-5.4-mini"

# Used when provider is "anthropic". Claude reads the PDF directly (no vector store).
# anthropic:
#   api_key: "ENV:PAPERFLUX_ANTHROPIC_API_KEY"
#   model: "claude-opus-4-8"

# Used when provider is "hermes". All fields are optional: PaperFlux reuses the
# LLM of whatever Hermes installation runs it (hermes.home, $HERMES_HOME, or
# ~/.hermes) — no separate API key setup. Uncomment only to override.
# hermes:
#   model: "my-preferred-model"      # default: Hermes model.default
#   provider: "my-hermes-provider"   # default: Hermes top-level model (named entry under Hermes providers:)
#   base_url: "https://.../v1"       # default: from Hermes config
#   api_key: "ENV:MY_KEY"            # default: $<key_env> from env or Hermes .env
#   key_env: "MY_KEY_ENV"            # default: key_env from Hermes config
#   home: "~/.hermes"                # default: $HERMES_HOME or ~/.hermes (profiles supported)

ui:
  detail_level: "medium"
  reasoning_effort: "medium"
  max_output_tokens: 32768
  highlight_colors:
    contributions: [1.0, 1.0, 0.0]
    limitations: [1.0, 0.6, 0.0]
    claims: [0.4, 0.6, 1.0]
    evidence: [0.0, 0.8, 0.3]

extraction_categories:
  categories:
    contributions: "Significant advancements, novel methods, or key findings presented in the paper."
    limitations: "Identified shortcomings, constraints, or areas where the research or methodology falls short."
    claims: "Specific assertions or hypotheses made by the authors that are central to the paper's arguments."
    evidence: "Data, experimental results, or logical arguments provided to support the claims made."

matching:
  min_similarity: 0.88
  max_window_tokens: 80

rag:
  category_prompt_file: "prompts/rag_category_prompt.j2"
  category_system_prompt_file: "prompts/rag_category_system_prompt.txt"
  summary_prompt_file: "prompts/rag_summary_prompt.j2"
  max_num_results:
  max_quotes_per_category: 8
  include_search_results: false
  vector_store_expires_after_days: 1
